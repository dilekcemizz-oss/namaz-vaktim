Build APK on: push: branches: [ main, master ] workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: - name: Kodu indir uses: actions/checkout@v4 - name: JDK 17 kur uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Gradle kur ve önbelleğe al uses: gradle/actions/setup-gradle@v4 - name: Gradle wrapper oluştur (yoksa) run: gradle wrapper --gradle-version 8.7 - name: Debug APK derle run: ./gradlew assembleDebug --stacktrace - name: APK'yı yükle (indirilebilir dosya olarak) uses: actions/upload-artifact@v4 with: name: EzanVaktim-debug-apk path: app/build/outputs/apk/debug/*.apk if-no-files-found: error
